name: Common Continuous Integration tasks

on:
  workflow_call:

permissions: {}

jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@90211d735aa0289702ddbd7eb95b218020ccadad # 2.0.2
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write

  check-nodejs:
    name: Test nodejs
    needs: linter
    uses: $/.github/workflows/__check-nodejs.yml
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write

  check-dist:
    name: Test nodejs
    needs: linter
    uses: $/.github/workflows/__check-dist.yml
    permissions:
      contents: read

  check-action:
    name: Test action
    needs: [check-nodejs, check-dist]
    uses: $/.github/workflows/__check-action.yml
    permissions:
      contents: read
