name: Common Continuous Integration tasks

on:
  workflow_call:

permissions: {}

jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@f44e1bcc350b6bfe9e4a86a27b1d5e032e58f292 # 4.2.1
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write

  check-nodejs:
    name: Test nodejs
    needs: linter
    uses: $/.github/workflows/__check-nodejs.yml
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write

  check-dist:
    name: Test nodejs
    needs: linter
    uses: $/.github/workflows/__check-dist.yml
    permissions:
      contents: read

  check-action:
    name: Test action
    needs: [check-nodejs, check-dist]
    uses: $/.github/workflows/__check-action.yml
    permissions:
      contents: read
