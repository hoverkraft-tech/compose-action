name: Internal - Rebuild action distributions

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  distributions:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/action-distributions.yml@f165c0ca3e88604611481e1408ace1e0e3a5ee47 # 4.3.1
    permissions:
      actions: read
      contents: read
      pull-requests: read
    with:
      build-script: package
      required-files: |
        index.js
        post.js
      pull-request-authors: '["dependabot"]'
