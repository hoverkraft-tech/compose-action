---
name: "Prepare release"

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  release:
    uses: hoverkraft-tech/ci-github-publish/.github/workflows/prepare-release.yml@bf24f894f60a3def62a8750f3964d05acb052c11 # 3.1.2
    permissions:
      contents: read
      pull-requests: write
